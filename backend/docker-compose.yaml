services:
  app:
    build: .
    ports:
      - "3003:3000"

    environment:
      - DB_HOST=db

    depends_on:
      - db

    volumes:
      - .:/app

  db:
    image: mysql:8

    environment:
      - MYSQL_ROOT_PASSWORD=root

    ports:
      - "2070:3306"

    volumes:
      - db_storage:/var/lib/mysql

volumes:
  db_storage: